<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />

    <!-- Theme before first paint, so prerendered pages don't flash (OPS-003 R-13) -->
    <script>
      ;(function () {
        var theme = 'dark'
        try {
          theme = localStorage.getItem('user-theme') || 'dark'
        } catch (e) {}
        var root = document.documentElement
        root.classList.add(theme === 'light' ? 'light' : 'dark')
        root.setAttribute('data-theme', theme)
      })()
    </script>

    <!--seo-->
    <title>YayPoker - Free Texas Hold'em Poker with Friends Online</title>
    <meta
      name="description"
      content="Play free Texas Hold'em poker with friends in your browser. No sign-up, no downloads: create a private table, share the link and deal. Virtual chips only."
    />
    <link rel="canonical" href="https://yaypoker.com/" />
    <!--/seo-->

    <!--jsonld-->
    <!-- Schema.org JSON-LD (home only; the prerender removes this block from other pages) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "VideoGame",
        "name": "YayPoker",
        "url": "https://yaypoker.com",
        "image": "https://yaypoker.com/og-image.jpg",
        "description": "Play Texas Hold'em Poker with friends for free. No registration required. Create private tables or join public matches.",
        "genre": ["Card Game", "Casino Game", "Multiplayer Online Game"],
        "playMode": "MultiPlayer",
        "applicationCategory": "Game",
        "browserRequirements": "Requires JavaScript. Supports WebSockets.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
    <!--/jsonld-->

    <!-- CSS for local font optimization -->
    <style>
      :root {
        --font-display:
          'Impact', 'Haettenschweiler', 'Arial Narrow Bold', sans-serif;
        --font-sans:
          system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        --font-mono:
          ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas,
          'Liberation Mono', 'Courier New', monospace;
      }

      body {
        font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background-color: #050505;
        color: #ffffff;
      }

      /* Utilidades para los componentes */
      .font-bebas {
        font-family: var(--font-display);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .font-mono {
        font-family: var(--font-mono);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

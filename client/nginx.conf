# Static site + SPA (spec OPS-003). Caddy terminates TLS in front of this server.
server {
    listen 80;
    root /usr/share/nginx/html;
    # Relative Location headers, so redirects keep Caddy's https scheme and host
    absolute_redirect off;

    # One URL per page: /about/ → /about
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets: cache forever, never fall back to HTML
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # App routes: client-rendered shell, not indexed
    location ~ ^/(lobby|public|new|join|play|watch|verify)(/|$) {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files /app.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Prerendered public pages (/about → /about/index.html) and static files
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Unknown paths: real 404 with the NotFound page
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
    }
}

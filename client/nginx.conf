# Static site + SPA (spec OPS-003). Caddy terminates TLS in front of this server.
server {
    listen 80;
    root /usr/share/nginx/html;
    # Relative Location headers, so redirects keep Caddy's https scheme and host
    absolute_redirect off;

    # Compress text assets: the main JS goes from ~418 KB to ~140 KB on the wire
    gzip on;
    gzip_vary on;
    # Caddy sends a Via header; without this nginx treats the request as proxied and skips gzip
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml text/plain;

    # One URL per page: /about/ → /about
    rewrite ^/(.+)/$ /$1 permanent;

    # Hashed build assets: cache forever, never fall back to HTML
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Shared links: the app shell with a link preview (chats show title, text and image), not indexed
    location ~ ^/join(/|$) {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files /invite.html =404;
    }
    location ~ ^/watch(/|$) {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files /watch.html =404;
    }

    # App routes: client-rendered shell, not indexed
    location ~ ^/(lobby|public|new|play|verify)(/|$) {
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
        try_files /app.html =404;
    }

    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    # Prerendered public pages (/about → /about/index.html) and static files
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    # Unknown paths: real 404 with the NotFound page
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex" always;
        add_header Cache-Control "no-cache";
    }
}
